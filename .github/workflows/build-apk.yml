name: Build Android APK
# Trigger APK build for latest main changes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web app
        run: |
          npm install
          npm run build
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -R dist/. app/src/main/assets/www/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Receipt-Maker-Pro-v1.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk Receipt-Maker-Pro.apk
          sha256sum Receipt-Maker-Pro.apk > Receipt-Maker-Pro.apk.sha256
          gh release create "$TAG" Receipt-Maker-Pro.apk Receipt-Maker-Pro.apk.sha256 --title "Receipt Maker Pro $TAG" --notes "Professional Android build from main. Includes resilient voice-engine recovery and lifecycle handling."
